# required for building jre_lwjgl3glfw with Java 8 while using plugins in runelite that require Java 11
org.gradle.configureondemand=true

android.useAndroidX=true
android.bundle.language.enableSplit=false
# Increase Gradle daemon RAM allocation (tuned down for this device's ~5 GB RAM)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Use the arm64 aapt2 from the device SDK instead of AGP x86_64 bundle
android.aapt2FromMavenOverride=/tmp/opencode/android-sdk/build-tools/35.0.1/aapt2
