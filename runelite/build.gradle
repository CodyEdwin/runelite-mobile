plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    String semVer = "3.1.1"
    // Used by the fallback for github actions
    ByteArrayOutputStream TAG_PART_COMMIT = new ByteArrayOutputStream()
    String TAG_STRING

    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    if (TAG.toString() == "") {
        exec {
            // Fallback for action builds
            try {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue true
                standardOutput = TAG_PART_COMMIT
            } catch (Exception e) {
            }
        }
    }


    if(TAG.toString() != ""){
        TAG_STRING = TAG.toString()
    }else {
        if(TAG_PART_COMMIT.toString().trim() == ""){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    return TAG_STRING.trim().replace("-g", "-") + "-" + semVer
}


def getLocalProperty = { String name ->
    Properties properties = new Properties()
    File localProperties = rootProject.file("local.properties")
    if(localProperties.canRead() && localProperties.isFile()) {
        localProperties.withInputStream { properties.load(it) }
    }
    return properties.getProperty(name)
}

def getSecret = { String envName, String propertyName ->
    String value = System.getenv(envName)
    if(value != null && !value.isEmpty()) return value
    return getLocalProperty(propertyName)
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'com.codyedwin.runelitemobile'

    compileSdk = 34

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            storeFile file(getSecret("XDAETHERIUM_RELEASE_STORE_FILE", "xdaetherium.release.storeFile") ?: "release.jks")
            storePassword getSecret("XDAETHERIUM_RELEASE_STORE_PASSWORD", "xdaetherium.release.storePassword") ?: ""
            keyAlias getSecret("XDAETHERIUM_RELEASE_KEY_ALIAS", "xdaetherium.release.keyAlias") ?: "release"
            keyPassword getSecret("XDAETHERIUM_RELEASE_KEY_PASSWORD", "xdaetherium.release.keyPassword") ?: ""
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.codyedwin.runelitemobile"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 30000521
        versionName "0.5.21"
        multiDexEnabled true //important
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "RuneLite Mobile (Debug)"
            resValue "string", "app_short_name", "RuneLite Mobile (Debug)"
            resValue 'string', 'application_package', 'com.codyedwin.runelitemobile.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.codyedwin.runelitemobile.debug.gamefolder'
            resValue 'string', 'shareProviderAuthority', 'com.codyedwin.runelitemobile.debug.share'
        }
        proguard {
            initWith release
            debuggable false
            minifyEnabled true
            shrinkResources true
        }

        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customRelease
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "RuneLite Mobile"
            resValue "string", "app_short_name", "RuneLite Mobile"
            resValue 'string', 'storageProviderAuthorities', 'com.codyedwin.runelitemobile.gamefolder'
            resValue 'string', 'application_package', 'com.codyedwin.runelitemobile'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    ndkVersion = "28.2.13676358"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '35.0.1'
}

afterEvaluate {
    // Explicit dependencies for which the apk relies on
    // RuneLite Mobile: the Minecraft-only helper modules (forge_installer, arc_dns_injector,
    // methods_injector_agent) were removed and LWJGL is no longer bundled.
    def jarDeps = []
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        dependsOn(jarDeps)
    }
    tasks.matching { it.name.contains("Lint") || it.name.contains("lint") }.configureEach {
        dependsOn(jarDeps)
    }

    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        doLast {
            def variantName = name.substring("merge".length(), name.length() - "Assets".length())
            def variantDir = variantName.substring(0, 1).toLowerCase() + variantName.substring(1)
            def componentsDir = file("$buildDir/intermediates/assets/$variantDir/$name/components")
            // x86/x86_64 LWJGL natives are kept since we now build for those ABIs
        }
    }
}

